# Perfil para la entrega, junto con el de MySQL: mvn spring-boot:run -Dspring-boot.run.profiles=mysql,prod
# La base se crea con backend/db/schema.sql; Hibernate solo revisa que coincida con las entidades.
spring.jpa.hibernate.ddl-auto=validate
# Todavía no hay mail real: sin esto nadie podría verificar su cuenta. Para la demo publicada, WOPFIT_DEV_CODES=true
# muestra el código en pantalla; con mail real va en false (el valor por defecto acá).
wopfit.dev-codes=${WOPFIT_DEV_CODES:false}
