spring.application.name=wopfit-api
server.port=8080

# Perfil por defecto: MySQL (ver docker-compose.yml en la raíz del proyecto)
spring.profiles.default=mysql

# Secretos: variables de entorno o el archivo .env de la raíz (no va a Git, ver .env.example)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT: el secreto sale de WOPFIT_JWT_SECRET (mínimo 32 caracteres)
wopfit.jwt.secret=${WOPFIT_JWT_SECRET}
wopfit.jwt.expiration-hours=168
# Frontend permitido (CORS)
wopfit.cors.origins=${WOPFIT_CORS_ORIGINS:http://localhost:5173}
# En desarrollo la API devuelve el código de verificación en la respuesta (no hay mail real)
wopfit.dev-codes=${WOPFIT_DEV_CODES:true}
