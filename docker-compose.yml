# Base de datos MySQL para desarrollo:  docker compose up -d
# La contraseña sale de DB_PASSWORD en el archivo .env (ver .env.example)
services:
  mysql:
    image: mysql:8.4
    container_name: wopfit-mysql
    environment:
      MYSQL_DATABASE: wopfit
      MYSQL_USER: wopfit
      MYSQL_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el archivo .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - wopfit-data:/var/lib/mysql
volumes:
  wopfit-data:
