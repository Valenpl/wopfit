# Base de datos MySQL para desarrollo:  docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: wopfit-mysql
    environment:
      MYSQL_DATABASE: wopfit
      MYSQL_USER: wopfit
      MYSQL_PASSWORD: wopfit
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - wopfit-data:/var/lib/mysql
volumes:
  wopfit-data:
